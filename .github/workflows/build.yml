name: Compila Wii

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlla git e make
        run: |
          which git || (apt-get update && apt-get install -y git)
          which make || (apt-get update && apt-get install -y make)

      - name: Compila GRRLIB
        run: |
          git clone --depth 1 https://github.com/GRRLIB/GRRLIB.git
          cd GRRLIB/GRRLIB
          make clean all install

      - name: Compila il gioco
        run: make

      - name: Salva il risultato
        uses: actions/upload-artifact@v4
        with:
          name: miihorror
          path: boot.dol
