name: Compila Wii

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlla git e make
        run: |
          which git || (apt-get update && apt-get install -y git)
          which make || (apt-get update && apt-get install -y make)

      - name: Compila GRRLIB
        run: |
          git clone --depth 1 https://github.com/GRRLIB/GRRLIB.git /tmp/GRRLIB
          cd /tmp/GRRLIB/GRRLIB
          make clean all install

      - name: Compila il gioco
        run: |
          INC=$(dirname "$(find / -name grrlib.h 2>/dev/null | head -n 1)")
          LIB=$(dirname "$(find / -name libgrrlib.a 2>/dev/null | head -n 1)")
          PORT=$DEVKITPRO/portlibs/ppc
          GCC=$DEVKITPPC/bin/powerpc-eabi-gcc
          MACH="-DGEKKO -mrvl -mcpu=750 -meabi -mhard-float"
          BASEINC="-I$DEVKITPRO/libogc/include -I$PORT/include -I$PORT/include/freetype2"

          echo "--- ricerca PNGU ---"
          find / -iname "*pngu*" 2>/dev/null | grep -v "^/proc" | head -n 20

          BROTLI=""
          if [ -f $PORT/lib/libbrotlidec.a ]; then BROTLI="-lbrotlidec -lbrotlicommon"; fi

          PNGU_OBJ=""
          PNGU_LIB=""
          PNGU_LIBFILE=$(find / -name libpngu.a 2>/dev/null | head -n 1)
          PNGU_C=$(find /tmp/GRRLIB -name pngu.c 2>/dev/null | head -n 1)
          if [ -n "$PNGU_LIBFILE" ]; then
            echo "Uso libpngu.a: $PNGU_LIBFILE"
            PNGU_LIB="-L$(dirname $PNGU_LIBFILE) -lpngu"
          elif [ -n "$PNGU_C" ]; then
            echo "Compilo pngu.c: $PNGU_C"
            $GCC -O2 $MACH $BASEINC -I$(dirname $PNGU_C) -c $PNGU_C -o pngu.o
            PNGU_OBJ=pngu.o
          else
            echo "PNGU NON TROVATO - albero di GRRLIB:"
            find /tmp/GRRLIB -maxdepth 3 | head -n 100
          fi

          $GCC -O2 -Wall $MACH $BASEINC -I$INC -c main.c -o main.o
          $GCC $MACH -L$DEVKITPRO/libogc/lib/wii -L$PORT/lib -L$LIB main.o $PNGU_OBJ -Wl,--start-group -lgrrlib $PNGU_LIB -lfreetype $BROTLI -lpng -ljpeg -lbz2 -lz -Wl,--end-group -lfat -lwiiuse -lbte -logc -lm -o boot.elf
          (which elf2dol && elf2dol boot.elf boot.dol) || $DEVKITPRO/tools/bin/elf2dol boot.elf boot.dol
          ls -l boot.dol

      - name: Salva il risultato
        uses: actions/upload-artifact@v4
        with:
          name: miihorror
          path: boot.dol
